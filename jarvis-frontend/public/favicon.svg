<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8944A" stop-opacity="1"/>
      <stop offset="50%" stop-color="#D4712B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4712B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#E8944A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4712B" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="16" cy="16" r="15" fill="url(#glow)" opacity="0.4"/>
  <!-- Main orb -->
  <circle cx="16" cy="16" r="10" fill="url(#core)"/>
  <!-- Inner bright core -->
  <circle cx="16" cy="16" r="4" fill="#FFFFFF" opacity="0.7"/>
  <!-- Highlight -->
  <circle cx="14" cy="14" r="2" fill="#FFFFFF" opacity="0.5"/>
</svg>
